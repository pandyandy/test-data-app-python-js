server {
    listen 8888;
    server_name _;

    # The Node/Express app serves both the static frontend and the /api
    # routes on its own port; nginx just proxies everything to it.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat responds with an SSE stream (Kai chat) - buffering would
        # hold the whole response until it closes instead of flushing deltas
        # as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
