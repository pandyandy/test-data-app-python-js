<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Data Visualization Dashboard</h1>
            <p class="subtitle">Interactive charts with dummy data</p>
        </header>

        <div class="dashboard-grid">
            <!-- Sales Chart -->
            <div class="card">
                <div class="card-header">
                    <h2>Monthly Sales Trend</h2>
                    <span class="card-badge">Last 12 Months</span>
                </div>
                <div class="card-body">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <!-- User Growth Chart -->
            <div class="card">
                <div class="card-header">
                    <h2>User Growth</h2>
                    <span class="card-badge">Last 30 Days</span>
                </div>
                <div class="card-body">
                    <canvas id="usersChart"></canvas>
                </div>
            </div>

            <!-- Revenue by Category -->
            <div class="card">
                <div class="card-header">
                    <h2>Revenue by Category</h2>
                    <span class="card-badge">Current Period</span>
                </div>
                <div class="card-body">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="card stats-card">
                <div class="stat-item">
                    <div class="stat-label">Total Sales</div>
                    <div class="stat-value" id="totalSales">-</div>
                    <div class="stat-change positive">+12.5%</div>
                </div>
            </div>

            <div class="card stats-card">
                <div class="stat-item">
                    <div class="stat-label">Active Users</div>
                    <div class="stat-value" id="activeUsers">-</div>
                    <div class="stat-change positive">+8.3%</div>
                </div>
            </div>

            <div class="card stats-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="totalRevenue">-</div>
                <div class="stat-change positive">+15.2%</div>
            </div>
        </div>

        <footer>
            <p>Data Visualization Dashboard • Refreshed automatically</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
