<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>Employee Data</h1>
            <p class="subtitle">out.c-data.employee-data &mdash; live via Keboola Storage Access</p>
        </header>

        <div id="banner" class="banner" hidden></div>

        <section class="panel">
            <div class="panel-header">
                <h2>Employees</h2>
                <div class="panel-actions">
                    <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
                    <button id="addRowBtn" class="btn btn-primary">Add employee</button>
                </div>
            </div>
            <div class="table-wrap">
                <table id="employeeTable">
                    <thead id="employeeTableHead"></thead>
                    <tbody id="employeeTableBody"></tbody>
                </table>
            </div>
            <p id="emptyState" class="empty-state" hidden>No employees yet. Click "Add employee" to create the first row.</p>
        </section>

        <section class="panel chat-panel">
            <div class="panel-header">
                <h2>Kai chat</h2>
                <button id="newChatBtn" class="btn btn-secondary">New chat</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div id="chatApproval" class="chat-approval" hidden>
                <span>A tool needs your approval before it runs.</span>
                <div class="chat-approval-actions">
                    <button id="chatApproveBtn" class="btn btn-primary btn-small">Approve</button>
                    <button id="chatDenyBtn" class="btn btn-secondary btn-small">Deny</button>
                </div>
            </div>
            <div id="chatSuggestions" class="chat-suggestions"></div>
            <form id="chatForm" class="chat-form">
                <input type="text" id="chatInput" placeholder="Ask Kai about your Keboola project…" autocomplete="off">
                <button type="submit" id="chatSendBtn" class="btn btn-primary">Send</button>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Activity log</h2>
                <button id="toggleLogBtn" class="btn btn-secondary">Show</button>
            </div>
            <div id="logPanel" class="log-panel" hidden>
                <ul id="logList"></ul>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
    <script src="kai.js"></script>
</body>
</html>
